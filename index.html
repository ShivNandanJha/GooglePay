<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fc"><title>Payflow Demo — UPI Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{font-family:'DM Sans',sans-serif;color:#1c2b45;background:#eaf0f8}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.shell{max-width:440px;min-height:100vh;background:#f6f8fc;margin:auto;padding-bottom:85px;position:relative;box-shadow:0 20px 70px #1f35531a}.banner{height:32px;background:#e4edff;color:#3f68b8;display:grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:1.1px}.top,.head{display:flex;align-items:center;justify-content:space-between;padding:22px 25px}.logo{font:800 24px Manrope;letter-spacing:-1px}.logo b{color:#2767ef}.profile{height:38px;width:38px;border-radius:50%;border:0;background:#dbe9ff;color:#3066be;font-weight:800}.wrap{padding:0 24px}.eyebrow{color:#8298b9;font-size:10px;letter-spacing:1.7px;font-weight:800}.hello{font:800 29px/1.32 Manrope;letter-spacing:-1.2px;margin:8px 0}.muted{color:#8796ac;font-size:12px;line-height:1.6}.hero{margin:24px 0;background:linear-gradient(120deg,#3173f4,#164ab7);color:#fff;border:0;border-radius:22px;min-height:218px;padding:24px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;width:100%;text-align:left}.hero:before{content:'';position:absolute;width:240px;height:240px;border:1px solid #ffffff43;border-radius:50%;right:-75px;top:-110px;box-shadow:0 0 0 35px #ffffff0d}.hero .symbol{position:relative;align-self:flex-end;font-size:47px;line-height:1}.hero small{color:#c7ddff;font-size:9px;letter-spacing:1.3px;font-weight:800}.hero h2{font:800 22px Manrope;margin:7px 0}.hero p{color:#d5e5ff;font-size:12px;margin:0}.section{margin-top:25px}.section h3{font:800 15px Manrope;margin:0 0 17px}.actions,.people{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.actions button,.people button{border:0;background:transparent;display:flex;align-items:center;gap:9px;flex-direction:column;font-size:11px;font-weight:700;color:#26374e}.action{display:grid;place-items:center;background:#dfebff;color:#2d63c1;border-radius:19px;width:59px;height:59px;font-size:24px}.actions button:nth-child(2) .action{background:#eee6ff;color:#7556c0}.actions button:nth-child(3) .action{background:#ffeadd;color:#bd8753}.actions button:nth-child(4) .action{background:#def5ea;color:#358c77}.avatar{height:56px;width:56px;border-radius:50%;background:#e0e9fd;color:#3260ad;display:grid;place-items:center;font-weight:800}.people button:nth-child(2) .avatar{background:#fbe9df;color:#a46b45}.people button:nth-child(3) .avatar{background:#eee5fc;color:#8157aa}.people button:nth-child(4) .avatar{background:#daf4e5;color:#40876a}.smallavatar{width:45px;height:45px;flex-shrink:0}.line{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #eef0f7;border-radius:15px;background:#fff;margin:9px 0;width:100%;text-align:left}.line .meta{flex:1;min-width:0}.line strong{font-size:12px;display:block}.line small{font-size:10px;color:#8797ab}.line .money{white-space:nowrap}.empty{border:1px dashed #d8e1ee;padding:28px 12px;color:#98a8bc;text-align:center;border-radius:15px;font-size:12px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:#fff;border-top:1px solid #e9edf5;display:grid;grid-template-columns:repeat(4,1fr);height:75px;padding:9px}.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:0;background:transparent;color:#8a9aaf;font-size:10px;font-weight:700}.nav button.on{color:#2767ea}.nav button span{font-size:20px}.head{justify-content:flex-start;gap:15px}.head button{border:0;background:transparent;font-size:23px;color:#243855}.head strong{font:800 18px Manrope}.head small{display:block;color:#8c99ab;font-size:11px}.tag{margin-left:auto;font-size:9px;background:#e5edff;color:#4266bc;padding:8px;border-radius:7px;letter-spacing:1px;font-weight:800}.panel{background:#fff;border-radius:19px;padding:18px;margin:15px 0}.scanner{height:275px;background:#dce6f5;position:relative;border-radius:16px;overflow:hidden;display:grid;place-items:center;color:#4d7ac0}.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.scanner .placeholder{z-index:1;text-align:center;background:#dce6f5cc;border-radius:12px;padding:18px}.scanner .placeholder strong{display:block;margin:7px}.scanner .placeholder small{font-size:10px}.scanner .corners{position:absolute;z-index:2;inset:40px 70px;border:3px solid #2b6df5;border-radius:17px;pointer-events:none}.primary{width:100%;min-height:52px;border:0;border-radius:14px;color:white;background:#2767e8;font-size:13px;font-weight:800;margin-top:13px}.option{display:flex;gap:13px;align-items:center;background:white;border:1px solid #eaf0f8;border-radius:14px;padding:15px;margin:9px 0;width:100%;text-align:left;color:#273955}.option .emoji{background:#e8eeff;padding:12px;border-radius:11px}.option .label{flex:1}.option strong{display:block;font-size:12px}.option small{font-size:10px;color:#8394a9}.notice{background:#e9f0ff;border-radius:12px;color:#5679b1;font-size:11px;line-height:1.6;padding:15px;margin:18px 0}.error{background:#fff0ef;color:#b13f41;padding:12px;font-size:12px;border-radius:11px}.field{display:block;width:100%;padding:13px;border-radius:10px;border:1px solid #e1e8f1;font-size:13px;margin:9px 0 13px}.center{text-align:center}.center .avatar{margin:15px auto}.center h2{font:800 23px Manrope}.pill{display:inline-block;background:#f0f4fb;color:#5073a6;border-radius:40px;padding:9px 13px;font-size:12px}.amount{display:flex;align-items:center;justify-content:center;font:800 41px Manrope}.amount input{font:800 41px Manrope;border:0;outline:0;width:65%;min-width:0}.amount input::-webkit-inner-spin-button{-webkit-appearance:none}.kv{display:flex;justify-content:space-between;align-items:center;gap:14px;border-bottom:1px solid #edf1f6;padding:17px 0;font-size:12px}.kv:last-child{border-bottom:0}.kv span{color:#8392a8}.kv strong{text-align:right;overflow-wrap:anywhere}.stamp{background:#fff0d9;color:#ad7431;border-radius:20px;padding:9px 13px;display:inline-block;font-size:10px;letter-spacing:1px;font-weight:800}.bigsum{font:800 38px Manrope;margin:15px 0}.check{height:97px;width:97px;border-radius:50%;background:#dff7e9;border:13px solid #edf9f1;color:#2cab70;display:grid;place-items:center;font-size:41px;margin:42px auto 24px}.receipt{background:white;border:1px solid #e8edf5;border-radius:16px;padding:10px 18px;margin:23px 0}.receipt>p{color:#ac7838;font-size:9px;letter-spacing:1px;font-weight:800;text-align:center}.subtle{border:0;background:none;color:#2868d9;font-size:12px;font-weight:800;padding:16px}.hidden{display:none!important}@media(min-width:480px){.shell{margin:28px auto;border-radius:27px;overflow:hidden;min-height:840px}.nav{bottom:0}.shell{box-shadow:0 30px 80px #192a4425}}
</style></head><body><main class="shell"><div class="banner">● &nbsp; SIMULATION ONLY &nbsp; · &nbsp; NO REAL PAYMENTS</div><div id="app"></div><nav id="nav" class="nav"><button onclick="go('home')" data-page="home"><span>⌂</span>Home</button><button onclick="go('scan')" data-page="scan"><span>▦</span>Scan QR</button><button onclick="go('history')" data-page="history"><span>◷</span>Activity</button><button onclick="go('profile')" data-page="profile"><span>♙</span>Profile</button></nav></main>
<script>
let page='home',recipient=null,amount='',note='',selected=null,scanner=null,scanning=false,history=[];try{history=JSON.parse(localStorage.getItem('payflow_transactions_v1')||'[]');if(!Array.isArray(history))history=[]}catch{history=[]}
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(n),av=(name,small=false)=>'<div class="avatar '+(small?'smallavatar':'')+'">'+esc(name.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase())+'</div>',head=(title,subtitle='')=>'<header class="head"><button onclick="back()" aria-label="Back">‹</button><div><strong>'+title+'</strong><small>'+subtitle+'</small></div><span class="tag">DEMO</span></header>',wrap=s=>'<div class="wrap">'+s+'</div>',btn=(label,fn='')=>'<button class="primary" '+(fn?'onclick="'+fn+'"':'')+'>'+label+' →</button>',kv=(a,b)=>'<div class="kv"><span>'+esc(a)+'</span><strong>'+esc(b)+'</strong></div>';
function parseUPI(value){const s=value.trim();if(!/^upi:\/\/pay\?/i.test(s))throw Error('Not a UPI payment QR. Use a upi://pay?... link.');let u=new URL(s);if(u.protocol!=='upi:'||u.hostname!=='pay')throw Error('Unsupported UPI QR');let upi=(u.searchParams.get('pa')||'').trim();if(!/^.{1,256}@[\w.-]+$/.test(upi))throw Error('The QR has no valid payee UPI ID (pa).');let am=u.searchParams.get('am')||'';return {upi,name:(u.searchParams.get('pn')||'UPI recipient').slice(0,100),amount:/^\d+(\.\d{1,2})?$/.test(am)&&Number(am)>0?am:'',note:(u.searchParams.get('tn')||'').slice(0,140)}}
function go(s){stopCamera();page=s;render();window.scrollTo(0,0)}function back(){go(page==='review'?'pay':page==='pay'?'scan':'home')}function startPay(r){recipient=r;amount=r.amount||'';note=r.note||'';go('pay')}function readURI(s){try{startPay(parseUPI(s))}catch(e){$('error').textContent=e.message;$('error').classList.remove('hidden')}}
const contacts=[['Aarav Mehta','aarav@example'],['Ananya Rao','ananya@example'],['Riya Shah','riya@example'],['Kabir Patel','kabir@example']];
function render(){let h='';$('nav').classList.toggle('hidden',['pay','review','done'].includes(page));document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.page===page));
if(page==='home'){h='<header class="top"><div class="logo">◈ payflow<b>.</b></div><button class="profile" onclick="go(\'profile\')">S</button></header>'+wrap('<div class="eyebrow">YOUR PAYMENT SPACE</div><h1 class="hello">Good morning ✳<br>Ready when you are.</h1><p class="muted">A familiar way to explore UPI — risk free.</p><button class="hero" onclick="go(\'scan\')"><div class="symbol">▦</div><div><small>QUICK & SIMPLE</small><h2>Scan any UPI QR ↗</h2><p>Scan a code. Try a payment.<br>No money leaves your account.</p></div></button><section class="section"><h3>Quick actions</h3><div class="actions"><button onclick="go(\'scan\')"><span class="action">▦</span>Scan QR</button><button onclick="go(\'scan\');openManual()"><span class="action">⌨</span>UPI ID</button><button onclick="go(\'history\')"><span class="action">◷</span>Activity</button><button onclick="go(\'profile\')"><span class="action">♙</span>Profile</button></div></section><section class="section"><h3>Try with a demo contact <small style="color:#96a2b5;font-size:9px"> · SAMPLE</small></h3><div class="people">'+contacts.map((c,i)=>'<button onclick="sample('+i+')">'+av(c[0])+'<span>'+c[0].split(' ')[0]+'</span></button>').join('')+'</div></section><section class="section"><h3>Recent activity <button class="subtle" onclick="go(\'history\')">View all ›</button></h3>'+(history.length?history.slice(0,3).map((t,i)=>tx(t,i)).join(''):'<div class="empty">Your simulated transactions will appear here.</div>')+'</section>')}
if(page==='scan'){h=head('Scan UPI QR','Point your camera at a payment code')+wrap('<div class="panel"><div class="scanner"><video id="video" autoplay muted playsinline></video><div class="corners"></div><div id="placeholder" class="placeholder"><div style="font-size:49px">▦</div><strong>Ready to scan</strong><small>Camera requires HTTPS or localhost</small></div></div>'+btn('Open camera','startCamera()')+'</div><p class="eyebrow center" style="margin:27px">OR SCAN ANOTHER WAY</p><label class="option"><span class="emoji">▧</span><span class="label"><strong>Upload QR image</strong><small>Choose a photo or screenshot</small></span>›<input type="file" accept="image/*" hidden onchange="readImage(this.files[0])"></label><button class="option" onclick="openManual()"><span class="emoji">⌨</span><span class="label"><strong>Paste UPI link</strong><small>Test without a QR</small></span>›</button><div id="manual" class="panel hidden"><strong style="font-size:12px">UPI payment URI</strong><textarea class="field" id="uri" rows="3" placeholder="upi://pay?pa=person@bank&pn=Name"></textarea>'+btn('Read recipient','readURI(document.getElementById(\'uri\').value)')+'</div><div id="error" class="error hidden" role="alert"></div><div class="notice">ⓘ &nbsp; Names come from the QR code and are not independently bank verified.</div>')}
if(page==='pay'&&recipient){h=head('Send demo payment','Recipient details')+wrap('<div class="center" style="margin:25px 0">'+av(recipient.name)+'<div class="eyebrow" style="margin-top:14px">PAYING TO</div><h2>'+esc(recipient.name)+'</h2><span class="pill">'+esc(recipient.upi)+'</span><p class="muted">QR-provided details · Not bank verified</p></div><div class="panel center"><p class="muted">Enter amount</p><div class="amount">₹ <input type="number" id="amount" value="'+esc(amount)+'" min=".01" max="100000" step=".01" inputmode="decimal" placeholder="0" oninput="amount=this.value"></div><label class="muted" style="display:block;text-align:left;margin-top:25px">Payment note (optional)<input class="field" id="note" value="'+esc(note)+'" maxlength="140" placeholder="What is this for?" oninput="note=this.value"></label></div><div class="panel"><strong style="font-size:12px">▣ &nbsp; Demo bank account</strong><p class="muted">Fictional account ···· 1234</p></div><div class="notice">No money will be sent or received. This is an offline simulation only.</div>'+btn('Continue','review()'))}
if(page==='review'&&recipient){h=head('Review payment','One last check')+wrap('<div class="center" style="padding:30px 0"><div class="eyebrow">SIMULATION AMOUNT</div><div class="bigsum">'+money(Number(amount))+'</div><span class="stamp">NOT A REAL PAYMENT</span></div><div class="panel">'+kv('Recipient',recipient.name)+kv('Recipient UPI ID',recipient.upi)+kv('Sender demo ID','demo.user@payflow')+kv('Bank','Fictional ···· 1234')+(note?kv('Note',note):'')+'</div><div class="notice">ⓘ &nbsp; This records a local demo only. No bank is contacted and the recipient gets no money or notification.</div>'+btn('Complete simulation','complete()'))}
if(page==='done'&&selected){h=wrap('<div class="center"><div class="check">✓</div><span class="stamp">DEMO · NOT PAID</span><h2 style="font:800 24px Manrope;margin-bottom:6px">Simulation complete</h2><p class="muted">This is not proof of payment.<br>No funds were transferred.</p><div class="bigsum">'+money(selected.amount)+'</div><div class="muted">To '+esc(selected.recipient.name)+'</div></div><div class="receipt">'+kv('Recipient UPI ID',selected.recipient.upi)+kv('Sender demo ID','demo.user@payflow')+kv('Simulation reference',selected.id)+kv('Date & time',new Date(selected.date).toLocaleString('en-IN'))+'<p>TEST RECORD ONLY · NOT A BANK RECEIPT</p></div>'+btn('Back to home',"go('home')")+'<button class="subtle" style="width:100%" onclick="go(\'history\')">View demo history</button>')}
if(page==='history'){h=head('Your activity','Stored locally on this device')+wrap('<div class="eyebrow" style="margin:27px 0 6px">ACTIVITY</div><h1 class="hello">Payment history</h1><p class="muted">Local simulations, not bank transactions.</p><div style="margin-top:23px">'+(history.length?history.map((t,i)=>tx(t,i)).join(''):'<div class="empty" style="padding:55px 15px">No demo transactions yet.<br><br><button class="primary" onclick="go(\'scan\')">Scan a UPI QR →</button></div>')+'</div>')}
if(page==='profile'){h=head('Demo profile','Stored in this browser')+wrap('<div class="panel center" style="padding:32px">'+av('Sample User')+'<h2>Sample User</h2><p class="muted">demo.user@payflow</p><span class="stamp">SIMULATED ACCOUNT</span></div><div class="panel">'+kv('Account type','Demo only')+kv('Bank','Fictional ···· 1234')+kv('Local transactions',String(history.length))+'</div><div class="notice">History stays on this device and is deleted when your browser storage is cleared.</div><button class="option" onclick="clearHistory()" style="color:#b75353">Clear local demo transaction history</button>')}
$('app').innerHTML=h}
function tx(t,i){return '<button class="line" onclick="openTxn('+i+')">'+av(t.recipient.name,true)+'<div class="meta"><strong>'+esc(t.recipient.name)+'</strong><small>SIMULATED · '+new Date(t.date).toLocaleDateString('en-IN')+'</small></div><strong class="money">'+money(t.amount)+'</strong></button>'}
function sample(i){startPay({name:contacts[i][0],upi:contacts[i][1]})}function openTxn(i){selected=history[i];go('done')}function openManual(){$('manual').classList.remove('hidden');$('uri').focus()}
function review(){let n=Number(amount);if(!Number.isFinite(n)||n<=0||n>100000){alert('Enter an amount between ₹0.01 and ₹1,00,000');return}go('review')}
function complete(){selected={id:'DEMO-'+crypto.randomUUID().slice(0,8).toUpperCase(),recipient,amount:Number(amount),note,date:new Date().toISOString(),status:'SIMULATED'};history.unshift(selected);localStorage.setItem('payflow_transactions_v1',JSON.stringify(history));go('done')}
function clearHistory(){if(confirm('Delete all local demo records?')){history=[];localStorage.removeItem('payflow_transactions_v1');render()}}
function stopCamera(){if(scanner){try{scanner.stop()}catch{}scanner=null}scanning=false}
async function startCamera(){if(scanning)return;scanning=true;const e=$('error');e.classList.add('hidden');try{const m=await import('https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm');let reader=new m.BrowserQRCodeReader();scanner=await reader.decodeFromVideoDevice(undefined,$('video'),(result)=>{if(result){stopCamera();readURI(result.getText())}});if($('placeholder'))$('placeholder').classList.add('hidden')}catch(err){scanning=false;e.textContent='Camera unavailable. Allow permission and use HTTPS, or upload a QR image. '+(err.message||'');e.classList.remove('hidden')}}
async function readImage(file){if(!file)return;try{let m=await import('https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm');let url=URL.createObjectURL(file);try{let result=await new m.BrowserQRCodeReader().decodeFromImageUrl(url);readURI(result.getText())}finally{URL.revokeObjectURL(url)}}catch(err){$('error').textContent='Could not read a UPI QR from that image.';$('error').classList.remove('hidden')}}
render();
</script></body></html>
